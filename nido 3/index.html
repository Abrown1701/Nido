<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nido</title>
  <meta name="theme-color" content="#F5E6D3">

  <!-- Home screen app icon and name (see the icons folder) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
  <meta name="apple-mobile-web-app-title" content="Nido">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Fonts. Fraunces and Nunito run the app; the rest are page font options
       listed in PAGE_FONTS in config.js. Add new ones to this one link. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Dancing+Script:wght@600&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&family=Permanent+Marker&family=Playfair+Display:wght@600&family=Shrikhand&family=Special+Elite&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Everything on screen is drawn into this one box by js/app.js -->
  <div id="app"></div>

  <!-- Pop-up windows (compose post, pick a mood) are drawn here -->
  <div id="modal-root"></div>

  <!-- Small "Saved!" style messages -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <!-- Our code, in this order -->
  <script src="config.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/data-demo.js"></script>
  <script src="js/data-supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
